spring:
  application:
    name: MusicPlay
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_HOST_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
search:
  host: ${SEARCH_HOST}
  port: ${SEARCH_HOST_PORT}
  collection: ${SEARCH_COLLECTION}
storage:
  host: ${STORAGE_HOST}
  hostPort: ${STORAGE_HOST_PORT}
  regionName: ${STORAGE_REGION_NAME}
  accessKey: ${STORAGE_ACCESS_KEY}
  secretKey: ${STORAGE_SECRET_KEY}
  customBucket: ${STORAGE_CUSTOM_BUCKET}