spring:
  application:
    name: MusicPlay
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_HOST_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          jwk-set-uri: ${AUTH_JWK_SET_URI}
          jws-algorithms: ${AUTH_JWS_ALGORITHMS}
          audiences: ${AUTH_AUDIENCES}
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
search:
  host: ${SEARCH_HOST}
  port: ${SEARCH_HOST_PORT}
  collection: ${SEARCH_COLLECTION}
storage:
  host: ${STORAGE_HOST}
  hostPort: ${STORAGE_HOST_PORT}
  regionName: ${STORAGE_REGION_NAME}
  accessKey: ${STORAGE_ACCESS_KEY}
  secretKey: ${STORAGE_SECRET_KEY}
  playlistBucket: ${STORAGE_PLAYLIST_BUCKET}
message:
  user:
    queueName: ${RABBIT_USER_QUEUE}